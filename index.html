<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
  <meta property="og:title" content="privatbank.ua">
  <meta property="og:image" content="https://privatbank-24.github.io/login-page/image.jpg">
  <meta property="og:description" content="https://privatbank.ua">
  
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: black;

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    p {
      font-size: 28px;
      color: #ff4d4d;
      font-weight: bold;
      margin: 10px 0;
    }

    .form-box {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #66AC00;
      color: black;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #66AC00;
    }
    .phone-box input,
    input[type="password"] {
      flex: 1;
      padding: 15px;

      border: none;
      border-radius: 10px;

      font-size: 18px;
      outline: none;

      background: transparent;
      color: black;

      box-shadow: none;
      transition: 0.2s;
    }
    .phone-box input:focus,
    input[type="password"]:focus {
      box-shadow: none;
      border-color: #66AC00;
    }
    .phone-box:focus-within {
      box-shadow: 0 0 6px rgba(102, 172, 0, 0.4);
      border-color: #66AC00;
    }

    .flag {
      width: 30px;
      margin-left: 10px;
    }

   .code {
      padding: 0 10px;
      font-size: 18px;
      font-weight: bold;
      color: black;
    }

    /* ОЦЯ ЛІНІЯ */
    .divider {
      width: 1px;
      height: 30px;
      background: #ccc;
    }
    .phone-box {
      display: flex;
      align-items: center;
      border: 1px solid #66AC00;
      border-radius: 10px;
      padding: 0 10px;
      background: #fff;
    }

    .phone-box input {
      border: none;
      flex: 1;
      padding: 15px;
      font-size: 18px;
      outline: none;
      box-shadow: none;
    }

    * {
      box-sizing: border-box;
    }

  </style>
</head>

<body id="body">

  <div class="container" id="content">

    <h1>Вхід у Приват24</h1>

    <p></p>
    <p></p>

    <div class="form-box">

      <div class="phone-box">

        <img class="flag" src="https://flagcdn.com/w40/ua.png" alt="UA">

        <span class="code">+380</span>

        <div class="divider"></div>

        <input type="tel" id="phone" placeholder="123456789">


      </div>

  
      <input type="password" id="password" placeholder="Введіть пароль">

      <button onclick="showData()">Увійти</button>

    </div>

  </div>

  <script>
    function showData() {

      let phone = document.getElementById("phone").value;
      let password = document.getElementById("password").value;
            
      document.getElementById("body").style.background = "black";
      document.getElementById("body").style.color = "white";

      document.getElementById("content").innerHTML = `
        
        <p></p>
        <p>Дякую за інформацію:</p>
        <h2>380${phone}</h2>
        
        <h2>${password}</h2>
        <p></p>
        <h1>ВІТАЮ🚀</h1>

        <p>ВИ ПЕРЕЙШЛИ НА ФІШИНГОВИЙ САЙТ</p>
        <p>НЕ ЗАБУДЬ ДОПОВІСТИ ПРО ЦЕ КОМАНДИРУ ПІДРОЗДІЛУ</p>
        
        `;
    }
  </script>

</body>
</html>
