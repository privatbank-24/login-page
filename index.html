<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
  <meta property="og:title" content="privatbank.ua">
  <meta property="og:image" content="https://privatbank-24.github.io/login-page/image.jpg">
  <meta property="og:description" content="https://privatbank.ua">
  
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    p {
      font-size: 28px;
      color: #ff4d4d;
      font-weight: bold;
      margin: 10px 0;
    }

    .form-box {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      box-sizing: border-box;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #ff4d4d;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff1a1a;
    }
  </style>
</head>

<body>

  <div class="container" id="content">

    <h1>ВІТАЮ🚀</h1>

    <p>ВИ ПЕРЕЙШЛИ НА ФІШИНГОВИЙ САЙТ</p>
    <p>НЕ ЗАБУДЬ ДОПОВІСТИ ПРО ЦЕ КОМАНДИРУ ПІДРОЗДІЛУ</p>

    <div class="form-box">

      <input type="text" id="login" placeholder="Введіть логін">

      <input type="password" id="password" placeholder="Введіть пароль">

      <button onclick="showData()">Відправити</button>

    </div>

  </div>

  <script>
    function showData() {

      let login = document.getElementById("login").value;
      let password = document.getElementById("password").value;

      document.getElementById("content").innerHTML = `
        
        <p></p>
        <p>Дякую за логін:</p>
        <h3>${login}</h3>
        <p>Гарний пароль:</p>
        <h3>${password}</h3>
        <p></p>
        <h1>ВІТАЮ🚀</h1>

        <p>ВИ ПЕРЕЙШЛИ НА ФІШИНГОВИЙ САЙТ</p>
        <p>НЕ ЗАБУДЬ ДОПОВІСТИ ПРО ЦЕ КОМАНДИРУ ПІДРОЗДІЛУ</p>
        
        `;
    }
  </script>

</body>
</html>
